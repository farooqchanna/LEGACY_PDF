name: Build LitePDF Reader

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # AGP 3.4.2 & Gradle 5.1.1 require Java 8 (Java 17 will crash with Unsupported class file major version 61)
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Set up Android SDK components (API 28 platform and build-tools 28.0.3)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LitePDF-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

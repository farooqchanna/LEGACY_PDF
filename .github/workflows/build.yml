name: Build Legacy Reader

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 1. Use Java 17 for SDK tools (sdkmanager requires Java 17+)
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Android 28 platform and build-tools 30.0.2 (required by AGP 4.2.2)
      - name: Accept Licenses & Install Android 28 Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;30.0.2"

      # Remove preinstalled NDK (NDK 27 lacks legacy 'platforms' directory that older AGP warns about)
      - name: Remove unused NDK
        run: |
          rm -rf $ANDROID_HOME/ndk* || true

      # 2. Use Java 11 for Gradle 6.7.1 & AGP 4.2.2 build
      - name: Set up Java 11 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ""
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Reader-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build LitePDF Reader

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 1. Use Java 17 for Android SDK tools (sdkmanager requires Java 17+)
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the runner's preinstalled sdkmanager directly (avoids broken third-party actions)
      - name: Accept Licenses & Install Android 28 Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"

      # 2. Switch to Java 8 for Gradle 5.1.1 & AGP 3.4.2
      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LitePDF-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m
# Use AndroidX? No - we use old support library for API 14 compat
android.useAndroidX=false
android.enableJetifier=false
# Do not fetch remote SDK repository manifests (prevents api-level 37.2 SAXParseException)
android.builder.sdkDownload=false
